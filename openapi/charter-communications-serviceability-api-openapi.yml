openapi: 3.2.0
info:
  title: Charter Communications Spectrum Enterprise Serviceability API
  description: The Spectrum Enterprise Open API provides enterprise clients the ability to integrate their systems with Spectrum Enterprise portal features including service ticketing and carrier serviceability.
  version: 1.0.0
  contact:
    name: Spectrum Enterprise
    url: https://enterprise.spectrum.com/
servers:
- url: https://enterprise.spectrum.com/api
  description: Production
tags:
- name: Serviceability
  description: Carrier serviceability operations
paths:
  /serviceability:
    get:
      operationId: checkServiceability
      summary: Check Serviceability
      description: Check carrier serviceability for a location.
      tags:
      - Serviceability
      parameters:
      - name: address
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceabilityResult'
components:
  schemas:
    ServiceabilityResult:
      type: object
      properties:
        address:
          type: string
        serviceable:
          type: boolean
        availableServices:
          type: array
          items:
            type: string
